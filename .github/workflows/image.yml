name: Prepared image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/etude/launch/runtime.py
      - src/etude/launch/providers/runpod/pod.py
      - scripts/test_pytorch_image.py
      - .github/workflows/image.yml

jobs:
  pytorch-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Verify the pinned image with offline runtime containers
        run: uv run --no-sync python scripts/test_pytorch_image.py
