name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A new PR head supersedes its old proof. Main and merge-group runs keep their
# own identity so independent integration proofs do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scratch belongs to work in progress. Delivery clears it before publishing a
  # landing candidate; queue and main runs never accept that exemption.
  scratch-clear:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.scratch.outputs.candidate }}
    steps:
      - uses: actions/checkout@v5
      - name: Select landing candidates and enforce scratch cleanup
        id: scratch
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ ! -d scratch ]; then
            echo "scratch/ is missing"
            exit 1
          fi
          EXTRA=$(find scratch -mindepth 1 ! -path 'scratch/.gitkeep' -print)
          if [ -n "$EXTRA" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "Checkpoint: checks are deferred until scratch/ is clear." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "candidate=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "scratch/ must be clear before landing"
            echo "$EXTRA"
            exit 1
          fi
          echo "candidate=true" >> "$GITHUB_OUTPUT"

  client-lint:
    needs: [scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy

  client-test:
    needs: [scratch-clear]
    if: ${{ !cancelled() && needs.scratch-clear.outputs.candidate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Run the client tests with the outside network denied
        run: uv run --no-sync python scripts/test_network.py uv run --no-sync pytest
        timeout-minutes: 15

  tests-result:
    # A skipped check is not proof. Only PR checkpoints may skip the aggregate;
    # a failed classifier must still produce a failing required check.
    if: ${{ always() && (github.event_name != 'pull_request' || needs.scratch-clear.result != 'success' || needs.scratch-clear.outputs.candidate != 'false') }}
    runs-on: ubuntu-latest
    needs: [scratch-clear, client-lint, client-test]
    steps:
      - name: Aggregate check results
        env:
          SCRATCH_CLEAR: ${{ needs.scratch-clear.result }}
          CLIENT_LINT: ${{ needs.client-lint.result }}
          CLIENT_TEST: ${{ needs.client-test.result }}
        run: |
          failures=0
          check_result() {
            if [ "$2" = success ]; then
              echo "PASS  $1"
            else
              echo "FAIL  $1 ($2)"
              failures=1
            fi
          }
          check_result scratch-clear "$SCRATCH_CLEAR"
          check_result client-lint "$CLIENT_LINT"
          check_result client-test "$CLIENT_TEST"
          exit "$failures"
