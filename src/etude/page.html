  <details id="failures-box" open><summary>Failed matches</summary><div class="scroll"><table id="failures"></table></div></details>
</div>

<script>
"use strict";
const PAGE = JSON.parse(document.getElementById("data").textContent);
// Each match's latest result, or a commit's view of the matches as played at it. Choosing a
// commit reloads the page, so every panel is drawn from that view's cells alone.
const asked = new URLSearchParams(location.hash.slice(1)).get("commit");
const COMMIT = PAGE.commits.some(k => k.commit === asked) ? asked : "";
const D = {...PAGE, cells: PAGE.cells.filter(c => (c.commit ?? "") === COMMIT)};
const M = model(D);
const {T, R, JOBS, marks, markOf, jobPoints, cellOf, bound, placed, members, fixedPlayers, configs, jobOfRun, playerName, selName, choices, evaluated} = M;
const TRAINED = T.runs.length > 0;

// The view lives in the URL, so a reload or a rewritten page shows the same thing. The x axis
// offers the clocks training declared or positions use, and wall time where training marks exist.
const clockNames = [...new Set([...T.clocks.map(c => c.name), ...M.posClocks]), ...(T.checkpoints.length || !M.posClocks.length ? [WALL] : [])];
const firstClock = clockNames.includes(R.clock) ? R.clock : clockNames[0];
const S = Object.assign({hide: "", filter: "{}", eclock: firstClock, pclock: firstClock, mlclock: firstClock, opp: "first", score: "0", sel: "", cfg: "", lines: "on", mjob: "", mkey: "", xline: "", smooth: "on", fpath: "", fscale: "share", live: "1"},
  Object.fromEntries(new URLSearchParams(location.hash.slice(1))), {commit: COMMIT});
for (const k of ["eclock", "pclock", "mlclock"]) if (!clockNames.includes(S[k])) S[k] = firstClock;
const writeHash = () => history.replaceState(null, "", "#" + new URLSearchParams(S));
const clockLabel = c => c === WALL ? "wall hours" : c;
const clockMeaning = c => c === WALL ? D.wall_meaning : (T.clocks.find(k => k.name === c) || {}).meaning || c;
const stepClocks = T.clocks.filter(c => c.kind === "step").map(c => c.name);

// ---------------------------------------------------------------- evals: what compare computed
function evalState() {
  if (!choices.some(([v]) => v === S.sel)) S.sel = choices.length ? choices[0][0] : "";
  if (+S.score >= D.scores.length) S.score = "0";
  if (!configs.includes(S.cfg)) S.cfg = configs[0] ?? "";
  return {sel: S.sel === "" ? null : +S.sel, score: +S.score, info: D.scores[+S.score]};
}
// A panel's own matches, else the section's; a tag or matchup alone is looked for in the section's tournament first.
function panelSel(E, panel) {
  const m = panel.matches;
  if (!m) return E.sel;
  const here = E.sel == null ? null : D.selections[E.sel].tournament;
  const fits = D.selections.map((s, i) => [s, i]).filter(([s]) => (m.tournament ?? s.tournament) === s.tournament && s.matchup === m.matchup && s.tag === m.tag);
  return (fits.find(([s]) => s.tournament === here) || fits[0] || [null, null])[1];
}
const opponents = (E, sel) => M.opponents(E.score, sel);
const oppFor = (E, sel) => { const o = opponents(E, sel); return (o.find(([v]) => v === S.opp) || o[0] || [""])[0]; };
const versusOf = opp => opp === "" ? "vs all opponents" : typeof opp === "object" ? ownVersus(opp) : `vs ${D.players[+opp].name}`;
// A curve's own opponent, as the evals model takes it, and as its subtitle names it.
const ownOpponent = panel => panel.opponent == null ? null : typeof panel.opponent === "string" ? {kind: "name", name: panel.opponent} : panel.opponent;
const ownVersus = o => o.kind === "name" ? `vs ${o.name}` : o.kind === "earlier" ? `vs the checkpoint ${num(o.by)} ${o.clock} earlier` : o.kind === "fraction" ? `vs the checkpoint at ${num(o.value)} × its ${o.clock}` : `vs the checkpoint at ${o.clock} ${num(o.value)}`;
let F = {}; try { F = JSON.parse(S.filter) || {}; } catch { F = {}; }
const evalValue = (E, sel, extra, opponent) => M.evalValue(E.score, sel, {...F, ...extra}, opponent, S.cfg);
// The other anchors' scores against the curve's anchor, as reference lines.
function anchorLines(E, sel, opp, extra = {}) {
  if (S.lines !== "on" || opp === "" || typeof opp === "object" || sel == null) return [];
  return fixedPlayers.filter(b => b !== +opp).map(b => cellOf(sel, E.score, b, +opp, false, {...F, ...extra})).filter(Boolean).map(c => ({y: c.value, label: D.players[c.subject].name}));
}
function values(E, sel, column, extra = {}) {
  const want = Object.keys({...F, ...extra, [column]: null}).sort().join(",");
  const found = new Set();
  for (const c of D.cells) if (c.selection === sel && c.score === E.score && !c.fixed && Object.keys(c.split).sort().join(",") === want
    && Object.entries({...F, ...extra}).every(([k, v]) => k === column || c.split[k] === v)) found.add(JSON.stringify(c.split[column]));
  return [...found].map(v => JSON.parse(v)).sort((a, b) => typeof a === "number" && typeof b === "number" ? a - b : String(a).localeCompare(String(b)));
}
// Diverging around the score's reference, else sequential over what is shown.
function painter(found, ref) {
  const lo = Math.min(...found), hi = Math.max(...found);
  return v => ref != null
    ? mixHex(css("--div-mid"), v >= ref ? css("--div-pos") : css("--div-neg"), Math.min(1, Math.abs(v - ref) / (Math.max(hi - ref, ref - lo) || 1)) ** 0.85)
    : mixHex(css("--div-mid"), css("--seq-hi"), hi > lo ? (v - lo) / (hi - lo) : 0.5);
}
function paintCell(cell, p, ref, paint) {
  // Faded where the band includes the reference: not distinguishable from even.
  const fade = ref != null && p.lo != null && p.lo <= ref && p.hi >= ref ? 0.35 : 1, c = paint(ref != null ? ref + (p.y - ref) * fade : p.y);
  cell.style.background = c; cell.style.color = inkOn(c); cell.textContent = fmt(p.y);
}
function rampLegend(c, ref, found, tail) {
  const legend = node("div", "legend"), ramp = node("span", "ramp");
  ramp.style.background = ref != null ? `linear-gradient(90deg, ${css("--div-neg")}, ${css("--div-mid")}, ${css("--div-pos")})` : `linear-gradient(90deg, ${css("--div-mid")}, ${css("--seq-hi")})`;
  legend.append(node("span", null, ref != null ? `below ${fmt(ref)}` : fmt(Math.min(...found))), ramp, node("span", null, ref != null ? `above ${fmt(ref)}` : fmt(Math.max(...found))), node("span", null, tail));
  c.appendChild(legend);
}

// ---------------------------------------------------------------- page
function card(host, title, sub, cls = "") { const c = node("div", "card " + cls), h = node("h3", null, title); if (sub) h.appendChild(node("span", null, sub)); c.appendChild(h); host.appendChild(c); return c; }
function control(host, label, options, key, apply = render) {
  if (options.length < 2) return;
  const group = node("div", "seg"); group.setAttribute("role", "group"); group.setAttribute("aria-label", label);
  for (const [value, text] of options) { const b = node("button", null, text); b.setAttribute("aria-pressed", String(S[key] === value)); b.onclick = () => { S[key] = value; apply(); }; group.appendChild(b); }
  host.append(node("span", "lbl", label), group);
}
const CLOCKS = clockNames.map(c => [c, clockLabel(c)]);
const draws = []; const later = f => draws.push(f);

function render() {
  writeHash(); draws.length = 0; destroyCharts(); hideTip();
  const hidden = new Set(S.hide ? S.hide.split("|") : []);
  const vis = JOBS.filter(j => !hidden.has(j.key));
  const color = j => css(j.color);
  const swatch = j => { const s = node("i", "sw" + (j.baseline ? " dot" : "")); s.style.background = j.baseline ? "" : color(j); s.style.color = color(j); return s; };
  const series = (fn, clock) => vis.map(j => ({label: j.label, color: color(j), dotted: j.baseline, points: fn(j)}));

  // ---- header and context
  document.getElementById("title").textContent = D.experiment;
  document.getElementById("pill").textContent = D.origin ? `${D.origin}()` : "default report";
  const ctx = document.getElementById("context"); ctx.replaceChildren();
  for (const n of D.notes) ctx.appendChild(node("div", "note", n));
  if (R.baseline != null && !JOBS.some(j => j.baseline)) ctx.appendChild(node("div", "note", `The baseline ${JSON.stringify(R.baseline)} names no job of this experiment.`));
  const kv = (k, v) => { const s = node("span", null, k + " "); s.appendChild(node("b", null, v)); ctx.appendChild(s); };
  const states = {}; for (const r of T.runs) states[r.state] = (states[r.state] || 0) + 1;
  if (TRAINED) {
    kv("Jobs", `${T.jobs.length} · ${T.runs.length} runs`);
    kv("Runs", Object.entries(states).map(([s, n]) => `${n} ${s}`).join(", "));
  } else kv("Evaluation only", "no training runs");
  kv("Checkpoints", progressText(progress(D, M)));
  if (D.environments.length > 1) kv("Environments", D.environments.map(e => e.name + (Object.keys(e.config).length ? " " + JSON.stringify(e.config) : "")).join(", "));
  if (D.latest_result_ms != null) kv("Latest result", `${when(D.latest_result_ms)} (${ago(D.latest_result_ms, D.generated_ms)} this page)`);
  kv("Read", `${when(D.generated_ms)} from ${D.source}`);
  if (D.refresh) {
    const l = node("label", "chip"), box = node("input"); box.type = "checkbox"; box.checked = S.live === "1";
    box.onchange = () => { S.live = box.checked ? "1" : "0"; writeHash(); };
    l.append(box, `Reload every ${D.refresh} s`); ctx.appendChild(l);
  }

  // ---- global: job selection (at least one stays on) and filters
  const jobsHost = document.getElementById("jobs"); jobsHost.replaceChildren();
  for (const j of JOBS) {
    const b = node("button", "jbtn"); b.append(swatch(j), j.label); if (j.baseline) b.appendChild(node("span", "tag", "baseline"));
    b.setAttribute("aria-pressed", String(!hidden.has(j.key))); b.title = j.line == null ? j.runs.join(", ") : j.line ? `line ${j.line}: checkpoints no training run saved, where their seats say they stood` : "checkpoints no training run saved and seated with no line, where their seats say they stood";
    b.onclick = () => { if (!hidden.has(j.key) && vis.length === 1) return; hidden.has(j.key) ? hidden.delete(j.key) : hidden.add(j.key); S.hide = [...hidden].join("|"); render(); };
    jobsHost.appendChild(b);
  }
  const chips = document.getElementById("chips"); chips.replaceChildren();
  for (const [k, v] of Object.entries(F)) {
    const c = node("span", "chip", `${k}: ${show(v)}`), b = node("button", null, "×"); b.setAttribute("aria-label", `Remove filter ${k}`);
    b.onclick = () => { delete F[k]; S.filter = JSON.stringify(F); render(); }; c.appendChild(b); chips.appendChild(c);
  }
  const setFilter = (pairs, toggle) => { const same = Object.entries(pairs).every(([k, v]) => F[k] === v); for (const [k, v] of Object.entries(pairs)) { if (toggle && same) delete F[k]; else F[k] = v; } S.filter = JSON.stringify(F); render(); };

  // ---- Evals
  const E = evalState(), ref = E.info?.reference;
  const ec = document.getElementById("evals-controls"); ec.replaceChildren();
  control(ec, "Matches", choices, "sel");
  const commits = D.commits.map(k => [k.commit, `${k.commit.slice(0, 10)} · ${k.matches} match${k.matches > 1 ? "es" : ""}`]);
  control(ec, "Played at", [["", "latest of each match"], ...commits], "commit", () => { writeHash(); location.reload(); });
  control(ec, "Score", D.scores.map((s, i) => [String(i), `${s.table}.${s.value}`]), "score");
  S.opp = oppFor(E, E.sel);
  control(ec, "Opponent", opponents(E, E.sel), "opp");
  control(ec, "Config", configs.map(c => [c, c === "{}" ? "no config" : c]), "cfg");
  control(ec, "Anchor lines", fixedPlayers.length > 1 ? [["on", "On"], ["off", "Off"]] : [], "lines");
  control(ec, "X axis", CLOCKS, "eclock");
  const body = document.getElementById("evals-body"); body.replaceChildren();
  const scoreName = E.info ? `${E.info.table}.${E.info.value}${E.info.per ? " per " + E.info.per : ""}` : "";
  document.getElementById("evals-sub").textContent = E.sel == null ? "no eval run yet" : `${selName(D.selections[E.sel])} · ${scoreName}`;
  const eOpts = {xLabel: clockLabel(S.eclock), ref, sync: "evals"};
  const GAPS = "○ not yet played · × failed · | not evaluated";
  // Only a job averages seeds; a line's curve is its checkpoints' own values.
  const BAND = vis.some(j => j.line == null) ? "mean over seeds · band: seed range, or one seed's 95% interval over matches" : "band: 95% interval over matches";
  const curveOf = (j, sel, extra = {}, opp = S.opp) => jobPoints(j, S.eclock, evalValue(E, sel, extra, opp));
  const latestKey = pts => { const ok = evaluated(pts); return ok.length ? ok[ok.length - 1].key : null; };
  const keyName = k => `${M.alignClock || "checkpoint"} ${num(k)}`;
  const finalKey = j => j.runs.every(r => T.runs.find(x => x.name === r)?.state === "finished") ? (marks.get(j.runs[0]) || []).at(-1)?.align ?? null : null;
  const unselected = panel => { const m = panel.matches || {}; return node("div", "na", `No eval run holds the matches this panel names (${[m.tournament && "tournament " + m.tournament, m.matchup && "matchup " + m.matchup, m.tag && "tag " + m.tag].filter(Boolean).join(", ")}).`); };
  if (!D.selections.length) card(body, "No evaluations", "", "full").appendChild(node("div", "na", `${D.file} defines no eval(state) yet. Define one and run etude eval on the file; its matches appear here.`));
  else for (const panel of R.evals) {
    const own = panel.kind === "curve" ? ownOpponent(panel) : null;
    const sel = panelSel(E, panel), opp = own ?? oppFor(E, sel), versus = versusOf(opp), where = sel == null ? "" : selName(D.selections[sel]);
    if (panel.kind === "curve" && !panel.split) {
      const c = card(body, panel.title, `${where} · ${scoreName} ${versus} · ${BAND} · ${GAPS}`, "full");
      if (sel == null) { c.appendChild(unselected(panel)); continue; }
      const host = node("div"); c.appendChild(host);
      later(() => line(host, series(j => curveOf(j, sel, {}, opp)), {...eOpts, refs: anchorLines(E, sel, opp), height: 260}));
    } else if (panel.kind === "curve") {
      const c = card(body, panel.title, `${where} · one chart per ${panel.split} · ${versus}`, "full");
      if (sel == null) { c.appendChild(unselected(panel)); continue; }
      const vals = values(E, sel, panel.split);
      if (!vals.length) { c.appendChild(node("div", "na", absentNote(panel.split))); continue; }
      const grid = node("div", "grid multiples"); c.appendChild(grid);
      for (const v of vals) { const m = node("div"), host = node("div"); m.append(node("div", "mini-title", `${panel.split} = ${show(v)}`), host); grid.appendChild(m); later(() => line(host, series(j => curveOf(j, sel, {[panel.split]: v}, opp)), {...eOpts, refs: anchorLines(E, sel, opp, {[panel.split]: v}), compact: true, height: 140})); }
    } else if (panel.kind === "matrix") {
      const c = card(body, panel.title || `${panel.columns} × ${panel.rows}`, `${where} · ${panel.columns} across · ${panel.rows} down · ${scoreName} ${versus}`, "full");
      if (sel == null) { c.appendChild(unselected(panel)); continue; }
      const both = (r, col) => ({[panel.rows]: r, [panel.columns]: col});
      const colsAt = values2(E, sel, panel.columns, panel.rows), rowsAt = values2(E, sel, panel.rows, panel.columns);
      if (!colsAt.length || !rowsAt.length) { c.appendChild(node("div", "na", absentNote(panel.rows, panel.columns))); continue; }
      if (!vis.some(j => j.key === S.mjob)) S.mjob = vis[0].key;
      const job = vis.find(j => j.key === S.mjob), done = evaluated(curveOf(job, sel, {}, opp)).map(p => p.key), last = finalKey(job);
      // A finished job is shown at its final checkpoint, evaluated or not; a running one at its latest evaluated.
      const keys = [...new Set([...done, ...(last != null ? [last] : [])])].sort((a, b) => a - b);
      const fallback = last ?? done[done.length - 1];
      const key = S.mkey !== "" && keys.includes(+S.mkey) ? +S.mkey : fallback;
      const tabs = node("div", "tabs-in");
      for (const j of vis) { const b = node("button", "jbtn"); b.append(swatch(j), j.label); b.setAttribute("aria-pressed", String(j === job)); b.onclick = () => { S.mjob = j.key; S.mkey = ""; render(); }; tabs.appendChild(b); }
      const pick = node("select"); pick.setAttribute("aria-label", "Checkpoint");
      for (const k of [...keys].reverse()) pick.appendChild(new Option(keyName(k) + (k === last ? " · final" : k === done[done.length - 1] ? " · latest evaluated" : ""), k, false, k === key));
      pick.onchange = () => { S.mkey = pick.value; render(); }; tabs.appendChild(pick); c.appendChild(tabs);
      if (key == null) { c.appendChild(node("div", "na", `${job.label} has no checkpoint every seed evaluated`)); continue; }
      const whole = curveOf(job, sel, {}, opp).find(p => p.key === key);
      if (!whole || whole.missing || whole.skip) { c.appendChild(node("div", "na", `${job.label} at ${keyName(key)}${key === last ? " (final)" : ""}: ${whole?.meta || "not evaluated"}`)); continue; }
      const at = (r, col) => curveOf(job, sel, both(r, col), opp).find(p => p.key === key);
      const grid = node("div", "matrix"); grid.style.gridTemplateColumns = `minmax(80px, auto) repeat(${colsAt.length}, minmax(38px, 1fr))`;
      const wrap = node("div", "mwrap"); wrap.appendChild(grid); c.appendChild(wrap);
      const corner = node("div", "rl", `${panel.rows} ↓ · ${panel.columns} →`); corner.style.fontSize = "10.5px"; grid.appendChild(corner);
      for (const col of colsAt) grid.appendChild(node("div", "cl", show(col)));
      const found = rowsAt.flatMap(r => colsAt.map(col => at(r, col))).filter(p => p && !p.missing && !p.skip).map(p => p.y);
      const paint = painter(found, ref);
      for (const r of rowsAt) {
        grid.appendChild(node("div", "rl", show(r)));
        for (const col of colsAt) {
          const p = at(r, col), ok = p && !p.missing && !p.skip, on = F[panel.rows] === r && F[panel.columns] === col;
          const cell = node("div", "cell" + (ok ? "" : " none") + (on ? " on" : ""));
          if (ok) paintCell(cell, p, ref, paint); else cell.textContent = "·";
          cell.onpointermove = evt => showTip(evt, ok ? [{value: fmt(p.y), label: p.meta}, ...(p.lo != null ? [{value: `${fmt(p.lo)}–${fmt(p.hi)}`, label: job.runs.length > 1 ? "seed range" : "95% interval"}] : [])] : [{value: "not recorded", label: p?.meta || ""}], `${job.label} · ${panel.columns} ${show(col)} · ${panel.rows} ${show(r)} · ${versus}`);
          cell.onpointerleave = hideTip;
          cell.onclick = () => setFilter(both(r, col), true);
          grid.appendChild(cell);
        }
      }
      rampLegend(c, ref, found, `· at ${keyName(key)}${key === last ? " (final)" : ""}${ref != null ? " · faded where the band includes " + fmt(ref) : ""} · click a cell to filter`);
    } else if (panel.kind === "ranking") {
      const commonKey = (() => { const sets = vis.map(j => new Set(evaluated(curveOf(j, sel, {}, opp)).map(p => p.key))); const shared = sets.length ? [...sets[0]].filter(k => sets.every(s => s.has(k))) : []; return shared.length ? Math.max(...shared) : null; })();
      const c = card(body, panel.title || `By ${panel.by}`, `${where} · ${commonKey != null ? `at ${keyName(commonKey)}, which every job evaluated` : "each job at its latest"} · ${versus}`);
      if (sel == null) { c.appendChild(unselected(panel)); continue; }
      const vals = values(E, sel, panel.by);
      if (!vals.length) { c.appendChild(node("div", "na", absentNote(panel.by))); continue; }
      const rows = vals.map(v => {
        const by = vis.map(j => { const pts = curveOf(j, sel, {[panel.by]: v}, opp), k = commonKey ?? latestKey(curveOf(j, sel, {}, opp)); return [j, pts.find(p => p.key === k && !p.missing && !p.skip)]; });
        const got = by.filter(([, p]) => p); return {v, by, mean: got.length ? mean(got.map(([, p]) => p.y)) : -Infinity};
      }).sort((a, b) => b.mean - a.mean);
      const ys = rows.flatMap(r => r.by.filter(([, p]) => p).map(([, p]) => p.y));
      const lo = Math.min(0, ...ys), hi = Math.max(...ys, ref ?? -Infinity, lo + 1e-9);
      for (const r of rows) {
        const row = node("div", "rk" + (F[panel.by] === r.v ? " on" : "")); row.tabIndex = 0; row.appendChild(node("span", null, show(r.v)));
        const bars = node("div", "bars");
        for (const [j, p] of r.by) {
          const b = node("div", "bar"), track = node("div", "track"), fill = node("b");
          fill.style.width = p ? ((p.y - lo) / (hi - lo) * 100) + "%" : "0"; fill.style.background = color(j); if (j.baseline) { fill.className = "dot"; fill.style.color = color(j); }
          track.appendChild(fill); if (ref != null) { const e = node("em"); e.style.left = ((ref - lo) / (hi - lo) * 100) + "%"; track.appendChild(e); }
          b.append(track, node("span", null, p ? fmt(p.y) : "n/r")); bars.appendChild(b);
        }
        row.appendChild(bars);
        const click = () => setFilter({[panel.by]: r.v}, true);
        row.onclick = click; row.onkeydown = evt => { if (evt.key === "Enter") click(); };
        row.onpointermove = evt => showTip(evt, r.by.map(([j, p]) => ({color: color(j), dotted: j.baseline, value: p ? fmt(p.y) : "not recorded", label: j.label + (p ? " · " + p.meta : "")})), `${panel.by} = ${show(r.v)}`);
        row.onpointerleave = hideTip; c.appendChild(row);
      }
    } else if (panel.kind === "head_to_head") {
      const c = card(body, panel.title, `${where} · a job's score against another job's checkpoints`);
      if (sel == null) { c.appendChild(unselected(panel)); continue; }
      const pairs = [];
      for (const a of vis) for (const b of JOBS) if (a !== b) {

    } else if (panel.kind === "crosstable") {

      const grid = node("div", "matrix"); grid.style.gridTemplateColumns = `minmax(110px, auto) repeat(${order.length}, minmax(44px, 1fr))`;

      const paint = painter(found.length ? found : [0], ref);

    } else if (panel.kind === "anchors") {
      // Fixed players are not a job's: drawn once, against each other.

      if (sel == null) { c.appendChild(unselected(panel)); continue; }
      const met = fixedPlayers.filter(a => D.cells.some(x => x.selection === sel && x.score === E.score && (x.subject === a || x.opponent === a) && (x.fixed || (!placed(x.subject) && x.opponent != null && !placed(x.opponent)))));
      if (!met.length) { c.appendChild(node("div", "na", "No two fixed players played each other in these matches")); continue; }

      const order = [...met].sort((a, b) => (strength(b)?.value ?? -Infinity) - (strength(a)?.value ?? -Infinity) || D.players[a].name.localeCompare(D.players[b].name));
      const grid = node("div", "matrix"); grid.style.gridTemplateColumns = `minmax(110px, auto) minmax(64px, 1fr) repeat(${order.length}, minmax(48px, 1fr))`;
      const wrap = node("div", "mwrap"); wrap.appendChild(grid); c.appendChild(wrap);
      grid.append(node("div", "rl", ""), node("div", "cl", "strength"));
      for (const b of order) grid.appendChild(node("div", "cl", D.players[b].name));
      const pointOfCell = x => x && {y: x.value, lo: x.interval?.[0], hi: x.interval?.[1], meta: `${x.rows} rows · ${x.matches} matches`};
      const found = order.flatMap(a => [strength(a), ...order.map(b => a === b ? null : cellOf(sel, E.score, a, b, false, F))]).filter(Boolean).map(x => x.value);
      const paint = painter(found, ref);
      for (const a of order) {
        grid.appendChild(node("div", "rl", D.players[a].name));
        for (const [b, x] of [[null, strength(a)], ...order.map(b => [b, a === b ? null : cellOf(sel, E.score, a, b, false, F)])]) {

          if (p) paintCell(cell, p, ref, paint); else cell.textContent = a === b ? "" : "·";
          cell.onpointermove = evt => showTip(evt, p ? [{value: fmt(p.y), label: p.meta}, ...(p.lo != null ? [{value: `${fmt(p.lo)}–${fmt(p.hi)}`, label: "95% interval"}] : [])] : [{value: "not recorded", label: ""}], `${D.players[a].name} ${b == null ? "against every anchor" : "vs " + D.players[b].name}`);

    } else card(body, `Unknown panel kind ${JSON.stringify(panel.kind)}`, "not drawn");
  }
  function values2(E, sel, column, other) {

    return [...found].map(v => JSON.parse(v)).sort((a, b) => typeof a === "number" && typeof b === "number" ? a - b : String(a).localeCompare(String(b)));
  }
  function absentNote(...cols) {
    const gone = cols.filter(col => D.absent.includes(`${E.info?.table}.${col}`));
    return gone.length ? `${gone.join(", ")} ${gone.length > 1 ? "are not columns" : "is not a column"} of ${E.info.table}` : "Nothing recorded for this selection";
  }

  // ---- Perf and ML details: what the training runs logged, and what Etude recorded.
  // Smoothed: the mean of up to seven neighbouring buckets, centred so it does not lag; gaps stay gaps.
  const smoothed = pts => pts.map((p, i) => {
    if (p.missing || p.y == null) return p;
    const near = pts.slice(Math.max(0, i - 3), i + 4).filter(q => !q.missing && q.y != null);
    return {...p, y: mean(near.map(q => q.y)), lo: null, hi: null};
  });
  const scaleX = (clock, x) => x == null ? null : clock === WALL ? x / 3600 : x;
  // A several-seed job is its band (mean, seed range); a one-seed job is its run's means.
  function metricPoints(j, key, clock) {
    const band = ((T.bands[clock] || {})[key] || []).find(l => l.owner === j.key);
    const l = band || (j.runs.length === 1 ? ((T.series[clock] || {})[key] || []).find(l => l.owner === j.runs[0]) : null);
    if (!l) return null;
    return l.x.map((x, i) => ({x: scaleX(clock, x), y: l.mean[i], lo: band ? l.low[i] : null, hi: band ? l.high[i] : null, missing: l.mean[i] == null, meta: band ? `${l.seeds[i]} seeds` : ""}));
  }
  const named = new Set([...(R.perf || []), ...(R.ml || [])].flatMap(p => p.keys || []));
  const prefixes = [...(R.perf || []), ...(R.ml || [])].filter(p => p.kind === "flame").map(p => p.prefix);
  function metricSection(section, panels, clockKey) {

    const ctl = document.getElementById(section + "-controls"); ctl.replaceChildren();
    if (!TRAINED) { host.appendChild(node("div", "na", "No training runs")); document.getElementById(section + "-sub").textContent = ""; return; }
    control(ctl, "X axis", CLOCKS, clockKey); control(ctl, "Lines", [["on", "Smoothed"], ["off", "Raw"]], "smooth");
    const clock = S[clockKey], opts = {xLabel: clockLabel(clock), band: true, sync: section};
    const missing = [];
    const prep = (pts, j) => S.smooth === "on"
      ? [{label: j.label, color: color(j), opacity: 0.25, width: 1, faint: true, points: pts.map(p => ({...p, lo: null, hi: null}))}, {label: j.label, color: color(j), dotted: j.baseline, points: smoothed(pts)}]
      : [{label: j.label, color: color(j), dotted: j.baseline, points: pts}];

      return lines;
    };
    for (const panel of panels) {

        const present = panel.keys.filter(k => T.metrics.includes(k));
        missing.push(...panel.keys.filter(k => !present.includes(k)));
        if (!present.length) continue;
        const c = card(host, panel.title, panel.unit + (panel.scale === "log" ? " · log scale" : ""), present.length > 1 ? "full" : "");
        if (present.length === 1) {
          for (const j of vis) { const p = metricPoints(j, present[0], clock); const last = p && [...p].reverse().find(q => !q.missing); if (last) { const r = node("div", "srow"); r.append(swatch(j), node("span", null, j.label), node("b", null, fmt(last.y))); c.appendChild(r); } }
          const h = node("div"); c.appendChild(h); chartKey(h, present[0], panel.scale, 170, false);
        } else {
          const grid = node("div", "grid multiples"); c.appendChild(grid);
          for (const k of present) { const m = node("div"), h = node("div"); m.append(node("div", "mini-title mono", k), h); grid.appendChild(m); chartKey(h, k, panel.scale, 140, true); }
        }
      } else if (panel.kind === "counters") {
        const present = panel.keys.filter(k => T.metrics.includes(k));
        missing.push(...panel.keys.filter(k => !present.includes(k)));
        if (!present.length) continue;
        const c = card(host, panel.title, "expected to stay at zero");
        for (const k of present) {
          c.appendChild(node("div", "mini-title mono", k));
          for (const j of vis) {
            const lines = j.runs.map(run => ((T.series[WALL] || {})[k] || []).find(l => l.owner === run)).filter(Boolean);
            const row = node("div", "counter"), label = node("span", null, j.label); label.style.color = "var(--ink-2)";
            if (!lines.length) { row.append(node("span", "icon na", "–"), label, node("span", "count", "not logged")); c.appendChild(row); continue; }

        const c = card(host, panel.title, "each step clock per wall second, between checkpoints · gaps: an attempt began", "full");
        if (!stepClocks.length || !T.checkpoints.length) { c.appendChild(node("div", "na", "No step clock and checkpoint to measure pace between")); continue; }
        const grid = node("div", "grid multiples"); c.appendChild(grid);
        for (const k of stepClocks) {

        }

        const h = node("div"); c.appendChild(h);
        later(() => line(h, series(j => jobPoints(j, clock, (run, mk) => ({y: mk.elapsed / 3600}))), {...opts, height: 170, yFormat: v => v.toFixed(v < 10 ? 2 : 1) + " h"}));

// ---- Flame: width is seconds, rows are timer depth. The zoom path applies to every job.
function flame(c, panel, vis, color, swatch) {
  const path = S.fpath ? S.fpath.split("/") : [];
  const per = stepClocks[0];
  const scales = [["share", "Share"], ["total", "Total"], ...(per ? [["per", `Per 1M ${per}`]] : [])];
  if (!scales.some(([v]) => v === S.fscale)) S.fscale = "share";
  const bar = node("div", "fl-bar"), crumbs = node("div", "crumbs"), root = node("button", null, "All");
  root.onclick = () => { S.fpath = ""; render(); }; crumbs.appendChild(root);
  path.forEach((name, i) => { crumbs.append(" › "); const b = node("button", null, name); b.onclick = () => { S.fpath = path.slice(0, i + 1).join("/"); render(); }; crumbs.appendChild(b); });
  const sc = node("div", "seg"); for (const [v, l] of scales) { const b = node("button", null, l); b.setAttribute("aria-pressed", String(S.fscale === v)); b.onclick = () => { S.fscale = v; render(); }; sc.appendChild(b); }
  bar.append(crumbs, sc); c.appendChild(bar);
  // A job's tree is its seeds' mean, node by node.
  const meanTree = trees => ({...trees[0], seconds: mean(trees.map(t => t.seconds)),
    children: [...new Set(trees.flatMap(t => t.children.map(ch => ch.name)))].map(name => meanTree(trees.map(t => t.children.find(ch => ch.name === name) || {name, seconds: 0, status: "recorded", children: []})))});
  const items = vis.map(j => {
    const trees = j.runs.map(run => T.timers.find(t => t.run === run && t.prefix === panel.prefix)).filter(Boolean);
    const steps = j.runs.map(run => T.runs.find(r => r.name === run)?.reached[per]).filter(v => v > 0);
    return {j, tree: trees.length === j.runs.length ? meanTree(trees.map(t => t.tree)) : null, steps: steps.length === j.runs.length ? mean(steps) : null};
  });
  if (!items.some(x => x.tree)) { c.appendChild(node("div", "na", `No timer logged under ${panel.prefix} for every seed of a job. Log seconds spent as ${panel.prefix}PART on each row to see where time went.`)); return; }
  const find = (n, names) => { let cur = n; for (const name of names) { cur = (cur.children || []).find(x => x.name === name); if (!cur) return null; } return cur; };
  const factor = x => S.fscale === "per" ? (x.steps ? 1e6 / x.steps : null) : 1;
  const focus = items.map(x => ({...x, f: x.tree && find(x.tree, path)}));
  const widest = Math.max(...focus.filter(x => x.f && factor(x) != null).map(x => x.f.seconds * factor(x)));
  const tops = new Map(); (focus.find(x => x.tree)?.tree.children || []).forEach((ch, i) => tops.set(ch.name, i));
  for (const x of focus) {
    const head = node("div", "fl-run"), name = node("b"); name.append(swatch(x.j), " ", x.j.label); head.appendChild(name); c.appendChild(head);
    if (!x.tree) { head.appendChild(node("span", null, "no timers for every seed")); continue; }
    if (!x.f) { head.appendChild(node("span", null, `no ${path[path.length - 1]} timer`)); continue; }
    const k = factor(x); if (k == null) { head.appendChild(node("span", null, `no ${per} recorded`)); continue; }
    head.appendChild(node("span", null, S.fscale === "per" ? `${dur(x.f.seconds * k)} per 1M ${per}` : `${dur(x.f.seconds)}${path.length ? ` · ${(x.f.seconds / x.tree.seconds * 100).toFixed(1)}% of active wall time` : ""}`));
    const fl = node("div", "flame"); c.appendChild(fl);
    const width = fl.clientWidth || c.clientWidth - 32, span = S.fscale === "share" ? width : width * x.f.seconds * k / widest;
    let depth = 0;
    const place = (n, left, w, d, top) => {
      depth = Math.max(depth, d);
      const el = node("div", "fn " + n.status), group = top ?? tops.get(n.name);
      const base = n.status === "unattributed" ? css("--t-rest") : d === 0 && !path.length ? css("--t-root") : css(`--t${(group ?? 0) % 4 + 1}`);
      const fill = n.status === "unattributed" ? base : mixHex(base, css("--surface"), Math.min(0.55, Math.max(0, d - 1) * 0.16));
      el.style.cssText = `left:${left}px;width:${Math.max(1, w - 1)}px;top:${d * 26}px;background:${fill};color:${n.status === "untimed" ? "" : inkOn(fill)}`;
      if (w > 64) el.textContent = `${n.name} · ${dur(n.seconds * k)}`;
      el.onpointermove = evt => showTip(evt, [{value: dur(n.seconds * k) + (S.fscale === "per" ? ` per 1M ${per}` : ""), label: `${(n.seconds / (x.f.seconds || 1) * 100).toFixed(1)}% of ${x.f.name}`}, {value: n.status, label: n.status === "summed" ? "its children's total; no timer of its own" : n.status === "untimed" ? "active wall time no timer covers" : n.status === "unattributed" ? "the parent's seconds its children leave" : panel.prefix + [...path, n.name].slice(1).join("/")}], n.name);
      el.onpointerleave = hideTip;
      if (n.children && n.children.length) el.onclick = () => { S.fpath = [...path, ...(n === x.f ? [] : [n.name])].join("/"); if (n !== x.f) render(); };
      fl.appendChild(el);
      let cx = left; for (const ch of n.children || []) { const cw = n.seconds ? w * ch.seconds / n.seconds : 0; place(ch, cx, cw, d + 1, d === 0 ? tops.get(ch.name) : group); cx += cw; }
    };
    place(x.f, 0, span, 0, path.length ? tops.get(path[0]) : null);
    fl.style.height = (depth + 1) * 26 + "px";
  }
}

function tables() {
  const t = document.getElementById("runs"); t.replaceChildren();
  document.getElementById("runs-box").hidden = !TRAINED;
  const head = node("tr"); for (const h of ["Run", "Job", "Seed", "State", "Rows", "Attempts", "Incomplete", "Dropped"]) head.appendChild(node("th", null, h)); t.appendChild(head);
  for (const r of T.runs) { const row = node("tr"); for (const [v, n] of [[r.name], [jobOfRun(r.name)?.label], [r.seed ?? "–", 1], [r.state], [r.rows.toLocaleString(), 1], [r.attempts.length, 1], [r.incomplete, 1], [r.dropped ?? "–", 1]]) row.appendChild(node("td", n ? "n" : "", String(v))); t.appendChild(row); }

  document.getElementById("coverage-box").hidden = !D.coverage.length;
  const h2 = node("tr"); for (const h of ["Training run", "Checkpoint", "Where it stood", "Tournament", "Played", "Failed", "Not yet played"]) h2.appendChild(node("th", null, h)); q.appendChild(h2);
  for (const c of D.coverage) {
    const m = markOf(c.run, c.ordinal), row = node("tr");
    for (const [v, n] of [[c.run], [c.ordinal, 1], [m ? Object.entries(m.at).map(([k, v]) => `${k} ${num(v)}`).join(", ") : "–"], [c.tournament], [c.played, 1], [c.failed, 1], [c.unplayed, 1]]) row.appendChild(node("td", n ? "n" : "", String(v)));
    q.appendChild(row);
  }
  const f = document.getElementById("failures"); f.replaceChildren();
  document.getElementById("failures-box").hidden = !D.failures.length;
  const h3 = node("tr"); for (const h of ["Tournament", "Players, by seat", "Error"]) h3.appendChild(node("th", null, h)); f.appendChild(h3);
  for (const x of D.failures) { const row = node("tr"); for (const v of [x.tournament ?? "outside a tournament", x.players.map(playerName).join(" vs "), x.error ?? "–"]) row.appendChild(node("td", null, v)); f.appendChild(row); }
}

// Section nav highlights the section in view.
const tabs = [...document.querySelectorAll("nav.tabs a")];
const io = new IntersectionObserver(entries => { for (const en of entries) if (en.isIntersecting) tabs.forEach(t => t.classList.toggle("on", t.dataset.s === en.target.id)); }, {rootMargin: "-40% 0px -55% 0px"});
["evals", "perf", "ml"].forEach(id => io.observe(document.getElementById(id)));
render();
let pending; addEventListener("resize", () => { clearTimeout(pending); pending = setTimeout(render, 120); });
if (D.refresh) setInterval(() => { if (S.live === "1" && !document.hidden) location.reload(); }, D.refresh * 1000);
</script>
</body>
</html>
