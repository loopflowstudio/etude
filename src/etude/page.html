<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · Etude</title>
<style>
:root {
  color-scheme: light;
  --page: #ffffff; --surface: #ffffff; --ink: #0a0a0a; --ink-2: #5f5f5f; --muted: #8a8a8a;
  --grid: #f0f0f0; --axis: #e3e3e3; --line: #e8e8e8; --wash: #f5f6f8; --bar: #e8f0fb;
  /* One hue, one meaning. Jobs: --j1..--j8, in declared order. Time stages: --t*.
     Green and red: only winning/losing and passing/failing. Everything else is ink. */
  --j1: #2a78d6; --j2: #eb6834; --j3: #1baf7a; --j4: #eda100;
  --j5: #e87ba4; --j6: #6250d6; --j7: #7a6a55; --j8: #5aa5c9;
  --good: #0ca30c; --warn: #b77900; --bad: #d03b3b;
  --t1: #6250d6; --t2: #e87ba4; --t3: #5aa5c9; --t4: #b3925f; --t-rest: #e1e0d9; --t-root: #52514e;
  --div-mid: #f0efec; --div-pos: #0a7a35; --div-neg: #b4302f; --seq-hi: #1d4f8f;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --page: #0b0b0b; --surface: #0b0b0b; --ink: #ededed; --ink-2: #a8a8a8; --muted: #767676;
  --grid: #1b1b1b; --axis: #2a2a2a; --line: #222222; --wash: #131518; --bar: #10233b;
  --j1: #3987e5; --j2: #d95926; --j3: #199e70; --j4: #c98500;
  --j5: #d55181; --j6: #9085e9; --j7: #a8957a; --j8: #4d97bb;
  --good: #3fbf6f; --warn: #e0a33a; --bad: #f06a6a;
  --t1: #9085e9; --t2: #d55181; --t3: #4d97bb; --t4: #a8895a; --t-rest: #2c2c2a; --t-root: #c3c2b7;
  --div-mid: #262626; --div-pos: #3fbf6f; --div-neg: #e66767; --seq-hi: #6ea8f0;
}}
* { box-sizing: border-box; }
html { scroll-padding-top: 56px; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 80px; }
code, .mono { font: 12px ui-monospace, Menlo, monospace; }
.head { padding: 26px 0 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; min-width: 240px; overflow-wrap: anywhere; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.context { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 10px 0 0; color: var(--ink-2); font-size: 13px; align-items: center; }
.context b { color: var(--ink); font-weight: 500; }
.note { flex-basis: 100%; color: var(--ink); background: var(--wash); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 18px 0; }
.sec-controls { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; font-weight: 400; }
.lbl { color: var(--muted); font-size: 13px; }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13px; border: 0; border-radius: 4px; background: none; color: var(--ink-2); padding: 3px 10px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--wash); color: var(--ink); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 6px 4px 10px; border-radius: 6px; background: var(--wash); border: 1px solid var(--line); }
.chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
nav.tabs { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin: 8px -16px 0; padding: 0 16px; display: flex; gap: 22px; }
nav.tabs a { color: var(--ink-2); text-decoration: none; font-size: 14px; padding: 12px 0 10px; border-bottom: 2px solid transparent; }
nav.tabs a.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
section.sec { padding-top: 26px; }
section.sec > h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
section.sec > h2 > span { color: var(--muted); font-size: 13px; font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
.grid.multiples { grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; margin-top: 8px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 10px; min-width: 0; }
.card.full { grid-column: 1 / -1; }
.card h3 { margin: 0; font-size: 13.5px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card h3 span { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.na { color: var(--muted); font-size: 13px; padding: 14px 0; }
.mini-title { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.legend-jobs { display: flex; gap: 6px; flex-wrap: wrap; }
.jbtn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.jbtn[aria-pressed=false] { color: var(--muted); }
.jbtn[aria-pressed=false] i { background: var(--axis) !important; color: var(--axis) !important; }
.tabs-in { display: inline-flex; gap: 4px; margin: 6px 0 2px; flex-wrap: wrap; align-items: center; }
.tabs-in .jbtn[aria-pressed=true] { border-color: var(--ink); font-weight: 500; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
i.sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; flex: none; }
/* The baseline job is dotted everywhere, in its own colour. */
i.sw.dot { background: radial-gradient(circle, currentColor 1.2px, transparent 1.6px) 0 50% / 4px 3px repeat-x !important; }
.srow { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; margin-top: 4px; }
.srow span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow b { font-size: 16px; font-weight: 600; }
.rk { display: grid; grid-template-columns: minmax(70px, 30%) 1fr; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 5px; cursor: pointer; }
.rk:hover { outline: 1px solid var(--axis); } .rk.on { background: var(--wash); }
.rk > span { font-size: 13px; overflow-wrap: anywhere; }
.rk .bars { display: grid; gap: 2px; }
.rk .bar { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; font-size: 11.5px; }
.rk .track { position: relative; height: 7px; background: var(--grid); border-radius: 2px; }
.rk .track b { position: absolute; inset: 0 auto 0 0; border-radius: 2px; }
.rk .track b.dot { background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px) !important; }
.rk .track em { position: absolute; top: -2px; bottom: -2px; border-left: 1px dashed var(--muted); opacity: .6; }
.rk .bar span { text-align: right; color: var(--ink-2); }
.mwrap { overflow-x: auto; margin-top: 8px; }
.matrix { display: grid; gap: 2px; }
.matrix .cl, .matrix .rl { color: var(--ink-2); font-size: 11.5px; display: flex; align-items: center; overflow-wrap: anywhere; }
.matrix .cl { justify-content: center; text-align: center; padding-bottom: 2px; } .matrix .rl { justify-content: flex-end; text-align: right; padding-right: 8px; }
.cell { border-radius: 3px; display: flex; align-items: center; justify-content: center; font: 500 11px/1 ui-monospace, Menlo, monospace; height: 30px; cursor: pointer; }
.cell:hover, .cell.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.none { background: repeating-linear-gradient(135deg, transparent 0 4px, var(--grid) 4px 5px); color: var(--muted); }
.legend { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 10px; flex-wrap: wrap; }
.legend .ramp { width: 140px; height: 8px; border-radius: 2px; }
.counter { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.counter .icon { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.counter .icon.ok { background: var(--good); } .counter .icon.bad { background: var(--bad); } .counter .icon.na { background: var(--axis); color: var(--ink-2); }
.counter .count { font-weight: 500; text-align: right; }
.missing { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
.missing code { color: var(--ink-2); background: var(--wash); padding: 1px 5px; border-radius: 4px; margin: 2px; display: inline-block; }
.att { display: grid; grid-template-columns: minmax(90px, 22%) 1fr; gap: 10px; align-items: center; font-size: 12.5px; margin: 6px 0; }
.att .lane { position: relative; height: 16px; background: var(--grid); border-radius: 3px; }
.att .lane b { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; min-width: 2px; }
.fl-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 10px; }
.crumbs { display: flex; gap: 4px; align-items: center; font-size: 12.5px; color: var(--muted); flex: 1; min-width: 200px; flex-wrap: wrap; }
.crumbs button { font: inherit; border: 0; background: none; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0; }
.fl-run { margin: 12px 0 4px; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; align-items: center; }
.fl-run span { color: var(--muted); }
.flame { position: relative; }
.fn { position: absolute; height: 24px; border-radius: 3px; font-size: 11.5px; line-height: 24px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--surface) 70%, transparent); }
.fn:hover { box-shadow: inset 0 0 0 2px var(--ink); }
.fn.untimed { background: repeating-linear-gradient(135deg, var(--wash) 0 5px, var(--grid) 5px 7px) !important; color: var(--muted) !important; font-style: italic; }
.fn.summed { font-style: italic; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 500; } td.n { text-align: right; }
.scroll { overflow-x: auto; }
details { margin-top: 18px; } details summary { cursor: pointer; color: var(--ink-2); }
.chart-svg { display: block; width: 100%; height: auto; overflow: visible; }
line.anchor { stroke: var(--ink-2); stroke-dasharray: 6 3; opacity: .55; } text.anchor-label { fill: var(--ink-2); font-size: 11px; } line.unevaluated { stroke: var(--muted); }
line.grid { stroke: var(--grid); } line.axis { stroke: var(--axis); } line.ref { stroke: var(--muted); stroke-dasharray: 2 3; opacity: .7; } line.cross { stroke: var(--axis); }
text.tick, text.axis-label { fill: var(--muted); font-size: 11px; } text.empty { fill: var(--muted); font-size: 13px; }
.tip { position: fixed; display: none; pointer-events: none; z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.08); font-size: 12.5px; max-width: min(420px, 90vw); }
.tip-title { color: var(--muted); margin-bottom: 4px; font-size: 12px; }
.tip-row { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: center; }
.tip-label { color: var(--ink-2); }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } .sec-controls { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="title"></h1><span class="pill" id="pill"></span></div>
  <div class="context" id="context"></div>
  <div class="controls"><div class="legend-jobs" id="jobs" role="group" aria-label="Jobs"></div><span id="chips" style="display:contents"></span></div>
  <nav class="tabs" id="tabs"><a href="#evals" data-s="evals">Evals</a><a href="#perf" data-s="perf">Perf</a><a href="#ml" data-s="ml">ML details</a></nav>
  <section class="sec" id="evals"><h2>Evals <span id="evals-sub"></span><div class="sec-controls" id="evals-controls"></div></h2><div class="grid" id="evals-body"></div></section>
  <section class="sec" id="perf"><h2>Perf <span id="perf-sub"></span><div class="sec-controls" id="perf-controls"></div></h2><div class="grid" id="perf-body"></div></section>
  <section class="sec" id="ml"><h2>ML details <span id="ml-sub"></span><div class="sec-controls" id="ml-controls"></div></h2><div class="grid" id="ml-body"></div></section>
  <details id="runs-box"><summary>Runs</summary><div class="scroll"><table id="runs"></table></div></details>
  <details id="coverage-box"><summary>Evaluated checkpoints</summary><div class="scroll"><table id="coverage"></table></div></details>
  <details id="failures-box" open><summary>Failed matches</summary><div class="scroll"><table id="failures"></table></div></details>
</div>
<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const T = D.training, R = D.report, WALL = "wall_seconds";

// ---------------------------------------------------------------- helpers
const node = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const mean = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
const num = v => v == null ? "—" : Math.abs(v) >= 1e9 ? (v / 1e9).toPrecision(3) + "G" : Math.abs(v) >= 1e6 ? (v / 1e6).toPrecision(3) + "M" : Math.abs(v) >= 1e4 ? (v / 1e3).toPrecision(3) + "k" : String(+(+v).toPrecision(4));
const fmt = v => v == null ? "—" : v !== 0 && Math.abs(v) < 1e-3 ? v.toExponential(2) : num(v);
const dur = s => s >= 3600 ? (s / 3600).toFixed(2) + " h" : s >= 60 ? (s / 60).toFixed(1) + " min" : s.toFixed(s < 1 ? 2 : 1) + " s";
const when = ms => new Date(ms).toLocaleString([], {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
const ago = ms => { const s = Math.max(0, (D.generated_ms - ms) / 1000); return s < 120 ? Math.round(s) + " s before" : s < 7200 ? Math.round(s / 60) + " min before" : s < 172800 ? Math.round(s / 3600) + " h before" : Math.round(s / 86400) + " d before"; };
const splitKey = o => JSON.stringify(Object.keys(o).sort().map(k => [k, o[k]]));
const show = v => typeof v === "boolean" ? (v ? "yes" : "no") : String(v);

// The view lives in the URL, so a reload or a rewritten page shows the same thing.
const clockNames = [...T.clocks.map(c => c.name), WALL];
const firstClock = clockNames.includes(R.clock) ? R.clock : clockNames[0];
const S = Object.assign({hide: "", filter: "{}", eclock: firstClock, pclock: firstClock, mlclock: firstClock, opp: "first", score: "0", sel: "", cfg: "", lines: "on", mjob: "", mkey: "", smooth: "on", fpath: "", fscale: "share", live: "1"},
  Object.fromEntries(new URLSearchParams(location.hash.slice(1))));
for (const k of ["eclock", "pclock", "mlclock"]) if (!clockNames.includes(S[k])) S[k] = firstClock;
const writeHash = () => history.replaceState(null, "", "#" + new URLSearchParams(S));
const clockLabel = c => c === WALL ? "wall hours" : c;
const clockMeaning = c => c === WALL ? D.wall_meaning : (T.clocks.find(k => k.name === c) || {}).meaning || c;
const stepClocks = T.clocks.filter(c => c.kind === "step").map(c => c.name);

// ---------------------------------------------------------------- tooltips and line charts
let tipNode;
function showTip(evt, rows, title) {
  if (!tipNode) { tipNode = node("div", "tip"); document.body.appendChild(tipNode); }
  const t = tipNode; t.replaceChildren();
  if (title) t.appendChild(node("div", "tip-title", title));
  for (const r of rows) {
    const line = node("div", "tip-row"), k = node("span");
    if (r.color) { k.className = "sw" + (r.dotted ? " dot" : ""); k.style.cssText = `display:inline-block;width:14px;height:3px;background:${r.dotted ? "" : r.color};color:${r.color}`; }
    line.append(k, node("strong", null, r.value), node("span", "tip-label", r.label || ""));
    t.appendChild(line);
  }
  t.style.display = "block";
  const pad = 14, w = t.offsetWidth, h = t.offsetHeight;
  let left = evt.clientX + pad, top = evt.clientY + pad;
  if (left + w > innerWidth - 8) left = Math.max(8, evt.clientX - w - pad);
  if (top + h > innerHeight - 8) top = Math.max(8, evt.clientY - h - pad);
  t.style.left = left + "px"; t.style.top = top + "px";
}
const hideTip = () => { if (tipNode) tipNode.style.display = "none"; };
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
function ticks(lo, hi, count) {
  const span = hi - lo || 1, mag = 10 ** Math.floor(Math.log10(span / count));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= count) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toFixed(10)); return out;
}
// series: [{label, color, dotted, opacity, width, points: [{x, y, lo, hi, missing, skip, gap, meta}]}]
// A missing point breaks its line: an evaluation that did not happen is never bridged. A
// skipped point is no point of the line. A point with a `gap` is marked below the line:
// ○ not yet played, × failed or some seeds only, | not evaluated. `refs`: [{y, label}].
function line(host, series, o = {}) {
  host.replaceChildren();
  const width = host.clientWidth || 600, height = o.height || 200;
  const m = o.compact ? {t: 8, r: 8, b: 22, l: 40} : {t: 12, r: 16, b: 34, l: 48};
  const svg = svgEl("svg", {viewBox: `0 0 ${width} ${height}`, width, height, class: "chart-svg", role: "img"}, host);
  const drawn = p => !p.missing && !p.skip && p.x != null && p.y != null;
  const all = series.flatMap(s => s.points.filter(drawn));
  const refs = o.refs || [];
  if (!all.length) { svgEl("text", {x: width / 2, y: height / 2, "text-anchor": "middle", class: "empty"}, svg).textContent = o.empty || "Nothing recorded for this selection"; return; }
  const xs = [...all, ...series.flatMap(s => s.points.filter(p => p.gap && p.x != null))].map(p => p.x);
  let ylo = Math.min(...all.map(p => p.lo ?? p.y)), yhi = Math.max(...all.map(p => p.hi ?? p.y));
  for (const r of [...(o.ref != null ? [o.ref] : []), ...refs.map(r => r.y)]) { ylo = Math.min(ylo, r); yhi = Math.max(yhi, r); }
  const pad = Math.max((yhi - ylo) * 0.08, Math.abs(yhi) * 0.05, 1e-9); ylo -= pad; yhi += pad;
  const xlo = Math.min(...xs), xhi = Math.max(...xs);
  const X = v => m.l + (xhi > xlo ? (v - xlo) / (xhi - xlo) : 0.5) * (width - m.l - m.r);
  const Y = v => m.t + (1 - (v - ylo) / ((yhi - ylo) || 1)) * (height - m.t - m.b);
  const yf = o.yFormat || fmt, xf = o.xFormat || num;
  for (const v of ticks(ylo, yhi, o.compact ? 3 : 4)) { svgEl("line", {x1: m.l, x2: width - m.r, y1: Y(v), y2: Y(v), class: "grid"}, svg); svgEl("text", {x: m.l - 6, y: Y(v) + 3.5, "text-anchor": "end", class: "tick"}, svg).textContent = yf(v); }
  for (const v of ticks(xlo, xhi, o.compact ? 3 : 6)) svgEl("text", {x: X(v), y: height - m.b + 14, "text-anchor": "middle", class: "tick"}, svg).textContent = xf(v);
  svgEl("line", {x1: m.l, x2: width - m.r, y1: height - m.b, y2: height - m.b, class: "axis"}, svg);
  if (o.xLabel && !o.compact) svgEl("text", {x: width - m.r, y: height - 4, "text-anchor": "end", class: "axis-label"}, svg).textContent = o.xLabel;
  if (o.ref != null) svgEl("line", {x1: m.l, x2: width - m.r, y1: Y(o.ref), y2: Y(o.ref), class: "ref"}, svg);
  // Labels of close anchors are stacked upward, so none covers another.
  let above = Infinity;
  for (const r of [...refs].sort((a, b) => a.y - b.y)) {
    svgEl("line", {x1: m.l, x2: width - m.r, y1: Y(r.y), y2: Y(r.y), class: "anchor"}, svg);
    const at = Math.min(Y(r.y) - 4, above - 12); above = at;
    if (!o.compact) svgEl("text", {x: width - m.r, y: at, "text-anchor": "end", class: "anchor-label"}, svg).textContent = r.label;
  }
  for (const s of series) {
    const pts = s.points.filter(p => !p.missing && p.x != null && p.y != null);
    const sparse = pts.length <= 5;

    head.appendChild(node("span", null, S.fscale === "per" ? `${dur(x.f.seconds * k)} per 1M ${per}` : `${dur(x.f.seconds)}${path.length ? ` · ${(x.f.seconds / x.tree.seconds * 100).toFixed(1)}% of active wall time` : ""}`));
    const fl = node("div", "flame"); c.appendChild(fl);
    const width = fl.clientWidth || c.clientWidth - 32, span = S.fscale === "share" ? width : width * x.f.seconds * k / widest;
    let depth = 0;
    const place = (n, left, w, d, top) => {
      depth = Math.max(depth, d);
      const el = node("div", "fn " + n.status), group = top ?? tops.get(n.name);
      const base = n.status === "unattributed" ? css("--t-rest") : d === 0 && !path.length ? css("--t-root") : css(`--t${(group ?? 0) % 4 + 1}`);
      const fill = n.status === "unattributed" ? base : mixHex(base, css("--surface"), Math.min(0.55, Math.max(0, d - 1) * 0.16));
      el.style.cssText = `left:${left}px;width:${Math.max(1, w - 1)}px;top:${d * 26}px;background:${fill};color:${n.status === "untimed" ? "" : inkOn(fill)}`;
      if (w > 64) el.textContent = `${n.name} · ${dur(n.seconds * k)}`;
      el.onpointermove = evt => showTip(evt, [{value: dur(n.seconds * k) + (S.fscale === "per" ? ` per 1M ${per}` : ""), label: `${(n.seconds / (x.f.seconds || 1) * 100).toFixed(1)}% of ${x.f.name}`}, {value: n.status, label: n.status === "summed" ? "its children's total; no timer of its own" : n.status === "untimed" ? "active wall time no timer covers" : n.status === "unattributed" ? "the parent's seconds its children leave" : panel.prefix + [...path, n.name].slice(1).join("/")}], n.name);
      el.onpointerleave = hideTip;
      if (n.children && n.children.length) el.onclick = () => { S.fpath = [...path, ...(n === x.f ? [] : [n.name])].join("/"); if (n !== x.f) render(); };
      fl.appendChild(el);
      let cx = left; for (const ch of n.children || []) { const cw = n.seconds ? w * ch.seconds / n.seconds : 0; place(ch, cx, cw, d + 1, d === 0 ? tops.get(ch.name) : group); cx += cw; }
    };
    place(x.f, 0, span, 0, path.length ? tops.get(path[0]) : null);
    fl.style.height = (depth + 1) * 26 + "px";
  }
}

function tables() {
  const t = document.getElementById("runs"); t.replaceChildren();
  const head = node("tr"); for (const h of ["Run", "Job", "Seed", "State", "Rows", "Attempts", "Incomplete", "Dropped"]) head.appendChild(node("th", null, h)); t.appendChild(head);
  for (const r of T.runs) { const row = node("tr"); for (const [v, n] of [[r.name], [jobOfRun(r.name)?.label], [r.seed ?? "–", 1], [r.state], [r.rows.toLocaleString(), 1], [r.attempts.length, 1], [r.incomplete, 1], [r.dropped ?? "–", 1]]) row.appendChild(node("td", n ? "n" : "", String(v))); t.appendChild(row); }
  const q = document.getElementById("coverage"); q.replaceChildren();
  document.getElementById("coverage-box").hidden = !D.coverage.length;
  const h2 = node("tr"); for (const h of ["Training run", "Checkpoint", "Where it stood", "Tournament", "Played", "Failed", "Not yet played"]) h2.appendChild(node("th", null, h)); q.appendChild(h2);
  for (const c of D.coverage) {
    const m = markOf(c.run, c.ordinal), row = node("tr");
    for (const [v, n] of [[c.run], [c.ordinal, 1], [m ? Object.entries(m.at).map(([k, v]) => `${k} ${num(v)}`).join(", ") : "–"], [c.tournament], [c.played, 1], [c.failed, 1], [c.unplayed, 1]]) row.appendChild(node("td", n ? "n" : "", String(v)));
    q.appendChild(row);
  }
  const f = document.getElementById("failures"); f.replaceChildren();
  document.getElementById("failures-box").hidden = !D.failures.length;
  const h3 = node("tr"); for (const h of ["Tournament", "Agents, by seat", "Error"]) h3.appendChild(node("th", null, h)); f.appendChild(h3);
  for (const x of D.failures) { const row = node("tr"); for (const v of [x.tournament ?? "–", x.agents.map(agentName).join(" vs "), x.error ?? "–"]) row.appendChild(node("td", null, v)); f.appendChild(row); }
}

// Section nav highlights the section in view.
const tabs = [...document.querySelectorAll("nav.tabs a")];
const io = new IntersectionObserver(entries => { for (const en of entries) if (en.isIntersecting) tabs.forEach(t => t.classList.toggle("on", t.dataset.s === en.target.id)); }, {rootMargin: "-40% 0px -55% 0px"});
["evals", "perf", "ml"].forEach(id => io.observe(document.getElementById(id)));
render();
let pending; addEventListener("resize", () => { clearTimeout(pending); pending = setTimeout(render, 120); });
if (D.refresh) setInterval(() => { if (S.live === "1" && !document.hidden) location.reload(); }, D.refresh * 1000);
</script>
