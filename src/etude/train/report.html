<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · Etude</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --panel: #ffffff; --rule: #e4e3df; --grid: #eeede9;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7b7a75;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --other: #9a9992;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #1a1a19; --panel: #222221; --rule: #3a3a37; --grid: #2c2c2a;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #94938a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #77766f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 2px; }
h2 { font-size: 15px; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
p.sub { color: var(--text-2); margin: 0 0 16px; }
.controls { position: sticky; top: 0; z-index: 3; background: var(--surface);
  padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
legend { float: left; margin-right: 8px; color: var(--text-2); padding: 0; }
label.opt { border: 1px solid var(--rule); border-radius: 6px; padding: 3px 9px; cursor: pointer; background: var(--panel); }
label.opt:has(input:checked) { border-color: var(--text); }
label.opt:has(input:focus-visible) { outline: 2px solid var(--s1); outline-offset: 1px; }
label.opt input { position: absolute; opacity: 0; }
#meaning { color: var(--text-2); flex-basis: 100%; }
.key { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 12px 0 0; color: var(--text-2); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i, .tip i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
figure .uplot { margin: 4px 0 0; }
figure { margin: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 10px 4px; position: relative; }
figcaption { font-weight: 600; overflow-wrap: anywhere; }
figcaption small { font-weight: 400; color: var(--text-3); margin-left: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgb(0 0 0 / .12); z-index: 2; min-width: 120px; }
.tip b { font-weight: 600; } .tip div { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.tip .x { color: var(--text-2); margin-bottom: 3px; }
table { border-collapse: collapse; width: 100%; background: var(--panel); }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--text-2); font-weight: 500; } td.n { text-align: right; }
.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }
.empty { color: var(--text-2); }
details summary { cursor: pointer; color: var(--text-2); margin: 4px 0 8px; }
</style>
<style>__UPLOT_CSS__</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <p class="sub" id="stamp"></p>
  <p class="sub" id="owner"></p>
  <div class="controls">
    <fieldset id="clocks"><legend>Clock</legend></fieldset>
    <fieldset id="modes"><legend>Show</legend></fieldset>
    <div id="meaning"></div>
  </div>
  <div class="key" id="key"></div>
  <h2>Runs</h2>
  <div class="scroll"><table id="runs"></table></div>
  <div id="charts"></div>
  <h2>Checkpoint evaluations</h2>
  <p>Exact checkpoint coordinates. Bands resample whole game matches, not training seeds. Missing or failed requests are gaps. Last result time describes evaluation freshness, never the x axis.</p>
  <div class="scroll"><table id="evaluations"></table></div>
  <div id="evaluation-charts" class="grid"></div>
</main>
<script type="application/json" id="data">__DATA__</script>
<script>__UPLOT_JS__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const SLOTS = 8;
const color = i => i < SLOTS ? `var(--s${i + 1})` : "var(--other)";
const el = (tag, text, attrs) => { const n = document.createElement(tag); if (text != null) n.textContent = text;
  for (const k in attrs || {}) n.setAttribute(k, attrs[k]); return n; };
const fmt = v => v == null ? "–" : Math.abs(v) >= 1e6 || (v !== 0 && Math.abs(v) < 1e-3)
  ? v.toExponential(2) : String(+v.toPrecision(4));
const axis = v => Math.abs(v) >= 1e6 ? +(v / 1e6).toPrecision(3) + "M" : Math.abs(v) >= 1e4 ? +(v / 1e3).toPrecision(3) + "k" : fmt(v);
// The view lives in the URL, so a reload or a regenerated report shows the same thing.
const asked = new URLSearchParams(location.hash.slice(1));
const anyJob = Object.keys(D.jobs).length > 0;
let clock = D.clocks.some(c => c.name === asked.get("clock")) ? asked.get("clock") : D.clocks[0].name;
let mode = anyJob && asked.get("mode") === "jobs" ? "jobs" : "runs";
let live = asked.get("live") !== "0";
// Run indices switched off; colours stay with the run.
const hidden = new Set(asked.getAll("hide").map(n => D.runs.findIndex(r => r.name === n)).filter(i => i >= 0));
function remember() {
  const p = new URLSearchParams();
  if (clock !== D.clocks[0].name) p.set("clock", clock);
  if (mode !== "runs") p.set("mode", mode);
  if (!live) p.set("live", "0");
  for (const i of hidden) p.append("hide", D.runs[i].name);
  history.replaceState(null, "", location.pathname + location.search + (p.size ? "#" + p : ""));
}

document.getElementById("title").textContent = D.experiment;
document.getElementById("sub").textContent =
  `${D.runs.length} run${D.runs.length === 1 ? "" : "s"}, read from their files. Lines are bucket means; the wash is each bucket's min to max. Drag across a chart to zoom, double-click to reset.`;
{
  const stamp = document.getElementById("stamp");
  stamp.append(`Generated ${new Date(D.generated_ms).toLocaleString()}.`);
  if (D.refresh) {
    const label = el("label", null, {class: "opt"}), box = el("input", null, {type: "checkbox"});
    box.checked = live;
    box.addEventListener("change", () => { live = box.checked; remember(); });
    label.append(box, document.createTextNode(`Reload every ${D.refresh} s`));
    stamp.append(" ", label);
    setInterval(() => { if (live && !document.hidden) location.reload(); }, D.refresh * 1000);
  }
}

if (D.owner) {
  const o = D.owner, age = o.observed_at ? Math.max(0, (Date.now() - Date.parse(o.observed_at)) / 1000) : null;
  document.getElementById("owner").textContent = `Owner: last training observation ${o.observed_at ?? "none"} (${age == null ? "unknown age" : Math.round(age) + " s ago"}); phase ${o.remote_phase}; update ${o.remote_updates}; cleanup ${o.cleanup_confirmed}; cost ${o.inclusive_cost ?? "unknown"}; settled ${o.settled}; error ${o.error ?? "none"}. Deadline ${new Date(D.owner_deadline * 1000).toISOString()}.`;
}
function options(id, items, current, set) {
  const box = document.getElementById(id);
  for (const [value, text] of items) {
    const label = el("label", null, {class: "opt"});
    const input = el("input", null, {type: "radio", name: id, value});
    input.checked = value === current;
    input.addEventListener("change", () => { set(value); draw(); });
    label.append(input, document.createTextNode(text));
    box.append(label);
  }
}
options("clocks", D.clocks.map(c => [c.name, c.name]), clock, v => clock = v);
if (anyJob) options("modes", [["runs", "Runs"], ["jobs", "Job mean, 95% interval over seeds"]], mode, v => mode = v);
else document.getElementById("modes").remove();

function runsTable() {
  const t = document.getElementById("runs");
  const head = el("tr"); for (const h of ["Show", "Run", "Job", "Seed", "Cohort", "Kind", "State", "Rows", "Checkpoints", "Attempts", "Incomplete", "Dropped"]) head.append(el("th", h));
  t.append(head);
  D.runs.forEach((r, i) => {
    const row = el("tr"), swatch = el("td"), line = el("i"), box = el("input", null, {type: "checkbox", "aria-label": `Show ${r.name}`});
    box.checked = !hidden.has(i); box.dataset.run = i;
    box.addEventListener("change", () => { box.checked ? hidden.delete(i) : hidden.add(i); draw(); });
    line.style.cssText = `display:inline-block;width:14px;height:2px;margin-left:6px;vertical-align:middle;background:${color(i)}`; swatch.append(box, line);
    row.append(swatch, el("td", r.name), el("td", r.job ?? "–"), el("td", r.seed == null ? "–" : String(r.seed), {class: "n"}), el("td", r.cohort ?? "–"), el("td", r.kind ?? "–"), el("td", r.state),
      el("td", r.rows.toLocaleString(), {class: "n"}), el("td", String(r.checkpoints), {class: "n"}), el("td", String(r.attempts), {class: "n"}), el("td", String(r.incomplete), {class: "n"}),
      el("td", r.dropped == null ? "–" : String(r.dropped), {class: "n"}));
    t.append(row);
  });
}
const token = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const wash = hex => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},.14)`; };
// Metric charts: uPlot on canvas, cursors synced across the page.
function plot(grid, title, note, lines) {
  const fig = el("figure"), cap = el("figcaption", title), holder = el("div"), tip = el("div", null, {class: "tip"});
  if (note) cap.append(el("small", note));
  tip.hidden = true; fig.append(cap, holder, tip); grid.append(fig);
  const tables = lines.map(l => [l.x, l.mean, l.min, l.max]);
  const data = tables.length === 1 ? tables[0] : uPlot.join(tables);
  const series = [{}], bands = [], ink = token("--text-3"), font = "10px system-ui, sans-serif";
  lines.forEach((l, i) => {
    const c = token(l.color.slice(4, -1));
    series.push({label: l.label, stroke: c, width: 2, spanGaps: !l.evaluation, points: {show: l.evaluation || l.x.length < 2}},
      {stroke: "transparent", spanGaps: true, points: {show: false}}, {stroke: "transparent", spanGaps: true, points: {show: false}});
    bands.push({series: [3 * i + 3, 3 * i + 2], fill: wash(c)});
  });
  const show = u => {
    const k = u.cursor.idx;
    if (k == null) { tip.hidden = true; return; }
    tip.replaceChildren(el("div", `${clock} ${fmt(u.data[0][k])}`, {class: "x"}));
    lines.forEach((l, i) => {
      const mean = u.data[3 * i + 1][k], lo = u.data[3 * i + 2][k], hi = u.data[3 * i + 3][k];
      if (mean == null) return;
      const row = el("div"), key = el("i"); key.style.background = l.color;
      row.append(key, el("b", fmt(mean)), el("span", l.label + (l.n ? ` (n=${l.n[l.x.indexOf(u.data[0][k])] ?? "?"})` : "")));
      if (lo != null) row.append(el("span", `${fmt(lo)} to ${fmt(hi)}`));
      tip.append(row);
    });
    tip.hidden = tip.children.length < 2;
    tip.style.left = Math.min(u.cursor.left + 60, holder.clientWidth - 150) + "px"; tip.style.top = "34px";
  };
  new uPlot({
    width: holder.clientWidth, height: 180, legend: {show: false}, series, bands,
    cursor: {sync: {key: "etude"}, points: {size: 6}}, scales: {x: {time: false}},
    axes: [
      {stroke: ink, font, size: 26, grid: {show: false}, ticks: {show: false}, values: (u, v) => v.map(axis)},
      {stroke: ink, font, size: 46, grid: {stroke: token("--grid"), width: 1}, ticks: {show: false}, values: (u, v) => v.map(axis)},
    ],
    hooks: {setCursor: [show]},
  }, data, holder);
}

function draw() {
  remember();
  evaluationCharts();
  const info = D.clocks.find(c => c.name === clock);
  document.getElementById("meaning").textContent = `${info.kind === "step" ? "Step" : "Time"}: ${info.meaning}`;
  const key = document.getElementById("key"); key.replaceChildren();
  const jobNames = [...new Set(D.runs.map(r => r.job).filter(Boolean))];
  const entries = mode === "jobs" ? jobNames.map((c, i) => [c, color(i)])
    : D.runs.map((r, i) => [r.name, color(i)]).filter((_, i) => !hidden.has(i));
  if (entries.length > 1) for (const [name, c] of entries) { const s = el("span"), i = el("i"); i.style.background = c; s.append(i, document.createTextNode(name)); key.append(s); }
  const charts = document.getElementById("charts"); charts.replaceChildren();
  const source = (mode === "jobs" ? D.jobs : D.series)[clock] || {};
  const groups = new Map();
  for (const metric of Object.keys(source)) {
    const group = metric.includes("/") ? metric.slice(0, metric.indexOf("/")) : "metrics";
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(metric);
  }
  if (!groups.size) charts.append(el("p", mode === "jobs" ? "No job has two runs on this clock." : "No run has chartable rows on this clock.", {class: "empty"}));
  for (const [group, metrics] of groups) {
    charts.append(el("h2", group));
    const grid = el("div", null, {class: "grid"});
    charts.append(grid);  // In the document first, so each chart can measure its width.
    for (const metric of metrics) {
      const lines = source[metric].filter(s => mode === "jobs" || !hidden.has(s.run)).map(s => mode === "jobs"
        ? {...s, label: s.job, color: color(jobNames.indexOf(s.job))}
        : {...s, label: D.runs[s.run].name, color: color(s.run)});
      if (!lines.length) continue;
      const bad = lines.reduce((n, l) => n + (l.nonfinite || 0), 0);
      plot(grid, metric, bad ? `${bad} NaN or infinite, not drawn` : "", lines);
    }
  }
}
function evaluationCharts() {
  const grid = document.getElementById("evaluation-charts"); grid.replaceChildren();
  const groups = new Map();
  for (const e of D.evaluations || []) {
    const run = D.runs.findIndex(r => r.name === e.training_run);
    if (hidden.has(run) || e.checkpoint.at[clock] == null) continue;
    for (const r of e.results) {
      const key = JSON.stringify([e.training_run, e.benchmark, r.environment, r.opponent, r.table, r.metric]);
      if (!groups.has(key)) groups.set(key, {e, r, points: []});
      groups.get(key).points.push({e, r});
    }
  }
  for (const {e, r, points} of groups.values()) {
    // Every request in this protocol contributes a position, including absent results.
    const all = (D.evaluations || []).filter(p => p.training_run === e.training_run && p.benchmark === e.benchmark && p.checkpoint.at[clock] != null)
      .sort((a, b) => a.checkpoint.at[clock] - b.checkpoint.at[clock] || a.run.localeCompare(b.run));
    const values = all.map(p => p.state === "failed" ? undefined : points.find(v => v.e.run === p.run)?.r);
    plot(grid, `${e.label}: ${r.table}/${r.metric}`, `${e.training_run}; protocol ${e.benchmark.slice(0, 12)}; opponent ${r.opponent.join("+").slice(0, 12)}`, [{
      x: all.map(p => p.checkpoint.at[clock]), mean: values.map(v => v?.value ?? null),
      min: values.map(v => v?.interval?.[0] ?? null), max: values.map(v => v?.interval?.[1] ?? null),
      label: e.training_run, color: color(Math.max(0, D.runs.findIndex(t => t.name === e.training_run))), evaluation: true,
    }]);
  }
}
function evaluationTable() {
  const table = document.getElementById("evaluations"), head = el("tr");
  for (const h of ["Training run", "Checkpoint SHA256", "Coordinates", "Evaluation run", "Protocol", "State", "Done / scheduled", "Failed / pending", "Latest result", "Rows / matches per metric (scheduled games)"]) head.append(el("th", h));
  table.append(head);
  for (const e of D.evaluations || []) {
    const row = el("tr");
    for (const v of [e.training_run, e.checkpoint.artifact.sha256, JSON.stringify(e.checkpoint.at), e.run, `${e.label} (${e.benchmark})`, e.state, `${e.done} / ${e.scheduled ?? "unknown"}`, `${e.failed} / ${e.pending ?? "unknown"}`, e.latest_result_ms == null ? "none" : new Date(e.latest_result_ms).toISOString(), e.results.map(r => `${r.table}/${r.metric}: ${r.rows} rows / ${r.matches} matches (${e.scheduled_games ?? "unknown"} games scheduled)`).join("; ")]) row.append(el("td", String(v)));
    table.append(row);
  }
}
runsTable();
evaluationTable();
draw();
let resizing;
addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(draw, 150); });
</script>
</body>
</html>
